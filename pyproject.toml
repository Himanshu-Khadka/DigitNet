[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digitnet"
version = "0.1.0"
description = "A neural network for handwritten digit recognition, built from scratch with NumPy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]
viz = ["matplotlib>=3.7"]

[project.scripts]
digitnet-train = "digitnet.train:main"
digitnet-predict = "digitnet.predict:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
